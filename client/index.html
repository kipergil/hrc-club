<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The single most consequential line on the page. Not one of the 90
      pages on the site this replaces carries a viewport tag, which is why
      none of them work on a phone.
    -->
    <title>Hertford &amp; District Table Tennis League</title>
    <meta
      name="description"
      content="Fixtures, results, tables and averages for the Hertford &amp; District Table Tennis League — ten clubs, formed 1936."
    />
    <!--
      An explicit SVG icon, which also stops the browser going looking for
      /favicon.ico — a request the site answered with a 404 on every single
      page view, and a blank tab icon for anyone who bookmarked it.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181d1b" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hertford &amp; District Table Tennis League" />
    <meta
      property="og:description"
      content="Fixtures, results, tables and averages for the Hertford &amp; District Table Tennis League."
    />
    <!--
      Applies the saved theme and text size before first paint. External,
      not inline, so the Content-Security-Policy can stay at
      `script-src 'self'` — see client/public/theme-init.js.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
